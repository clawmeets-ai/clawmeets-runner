[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawmeets"
version = "1.1.8"
description = "Agent runner for clawmeets multi-agent collaboration"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "typer>=0.12",
    "pydantic>=2.7",
    "aiofiles>=23",
    "bcrypt>=4.0.0",
    # MCP SDK + Google client stack are part of the baseline install so the
    # in-tree Gmail and Google Calendar MCP servers, and `clawmeets mcp auth`,
    # work out of the box. Collectively ~15 MB on disk — small enough that
    # gating them behind optional extras costs more user friction than it saves.
    "mcp>=1.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "python-chess>=1.10",
    # CalDAV (caldav + vobject) and iCalendar (icalendar) for the
    # `calendar` MCP — the personal_data template's CalDAV-backed
    # calendar agent. caldav wraps requests + vobject; icalendar is used
    # for create_event.
    "caldav>=1.3",
    "vobject>=0.9.7",
    "icalendar>=5.0",
    # Browser skill: Python playwright + the patchright stealth runtime, bundled
    # by default so the playwright-browser skill works out of the box (run
    # `clawmeets bootstrap browser` once to fetch the Chrome/Chromium binary).
    # patchright closes the CDP Runtime.enable leak that defeats Cloudflare
    # Turnstile; it has no Python 3.14 build, so it's gated off there and the
    # skill falls back to stock Playwright (with a warning) on 3.14.
    "playwright>=1.40",
    "patchright>=1.40; python_version < \"3.14\"",
    # In-process, BYO-key LLM providers (clawmeets/llm/api_provider.py): one
    # Pydantic-AI-backed provider drives Anthropic / OpenAI / Gemini / OpenRouter
    # with no CLI binary. The duckduckgo + web-fetch groups power the WebSearch /
    # WebFetch local fallbacks; genai-prices computes per-request cost_usd.
    "pydantic-ai-slim[anthropic,openai,google,mcp,duckduckgo,web-fetch,openrouter]>=1.0",
    "genai-prices>=0.0.60",
]

[project.scripts]
clawmeets = "clawmeets.cli:main"

[project.urls]
Homepage = "https://github.com/clawmeets-ai/clawmeets"
Repository = "https://github.com/clawmeets-ai/clawmeets"
Issues = "https://github.com/clawmeets-ai/clawmeets/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawmeets*"]
namespaces = true

[tool.setuptools.package-data]
"clawmeets.mcp.servers" = ["*.html"]
# Bundle the Claude Code plugin so the runner can register the
# /clawmeets:* slash commands on any install (pip / uv tool / pipx). The
# files live at clawmeets/_clawmeets_plugin/ inside the wheel; cli_runner.py
# auto-detects them via Path(__file__).parent / "_clawmeets_plugin".
#
# Also bundle the system-skills source tree so SystemSkillManager can
# materialize per-audience symlink trees at runner startup. Resolves via
# Path(__file__).parent.parent / "system_skills".
clawmeets = ["_clawmeets_plugin/**/*", "system_skills/**/*"]
